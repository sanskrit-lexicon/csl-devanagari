name: Unit tests

# The converter's own gate — the one CI never ran (bughunt 26-10-2026, finding 6).
# 14 tests protected the SLP1 <-> Devanagari round trip while the only workflows
# here were changelog lint and Dependabot auto-merge, so a conversion regression
# could land with a green tick and first show up in a proofreader's browser.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converter-tests:
    name: Converter — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      # Pinned to the version the current mirror was verified against; bump with
      # the mirror regeneration, not on Dependabot's schedule.
      - run: python -m pip install --quiet "indic-transliteration==2.3.82"
      - name: Unit tests (incl. the main-tree guard pin)
        run: python -m unittest discover -s scripts -p "test*.py"
      - name: Byte-compile every tool
        run: python -m py_compile scripts/*.py
